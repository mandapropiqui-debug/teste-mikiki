<script>
(function(){
var BP=900,q=location.search.match(/[?&]v=(m|d)\b/),forced=!!q;
var mq=window.matchMedia('(max-width:'+(BP-1)+'px)');
var mode=forced?q[1]:(mq.matches?'m':'d');
var tpl=document.getElementById('tpl-'+mode);
var go=false;
function boot(){
  if(go)return;go=true;
  document.body.className=tpl.getAttribute('data-body')||'';
  document.body.appendChild(tpl.content.cloneNode(true));
  document.documentElement.setAttribute('data-layout',mode==='m'?'mobile':'desktop');
  ['mk.js',(mode==='m'?'mobile':'desktop')+'.js'].forEach(function(f){
    var s=document.createElement('script');s.src=f;s.async=false;document.body.appendChild(s);
  });
}
var l=document.createElement('link');l.rel='stylesheet';l.href=(mode==='m'?'mobile':'desktop')+'.css';
l.onload=boot;l.onerror=boot;document.head.appendChild(l);
setTimeout(boot,2500);
if(!forced&&mq.addEventListener){
  var t;mq.addEventListener('change',function(){clearTimeout(t);t=setTimeout(function(){location.reload()},150)});
}
})();
</script>
